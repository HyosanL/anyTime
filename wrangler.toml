# Cloudflare Pages + Functions 설정
# - 정적 빌드 출력: dist  (Vite)
# - Pages Functions(functions/api/*) 는 EXAM_FILES(R2) 와 아래 vars 를 사용
# 배포: wrangler pages deploy dist   (또는 대시보드 Git 연동)
name = "anytime"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# Functions 런타임 변수 (VAPID 공개키는 공개 안전)
# ※ 비밀값(SWEEP_SECRET·PUSH_SECRET·VAPID_PRIVATE_KEY·GEMINI_API_KEY)은
#   Pages 대시보드 Secret(또는 wrangler pages secret put)으로만 관리.
[vars]
VAPID_PUBLIC_KEY = "BGtso3kqB7AAA-AOUSuuA7GevBHMj2z4I3y-hY6XC9hftbYb1qyTUEAi4kyKOTnY0N1wP7LkNuhhMpMdsVYtNFQ"
VAPID_SUBJECT = "mailto:hyosanl0211@gmail.com"

# ※ Firebase 이관(2026-08-31, functions/api/_middleware.js): 로그인 검증은 Firebase ID
#   토큰(RS256, JWKS)으로 한다. 새 시크릿 불필요 — JWKS(https://www.googleapis.com/
#   service_accounts/v1/jwk/securetoken@system.gserviceaccount.com)는 Google 이 공개
#   호스팅하므로 인증 없이 조회 가능하고, jose 의 createRemoteJWKSet 이 응답을 캐싱한다.
#   프로젝트 ID(`anytime-rokafa`)는 issuer/audience 검사에 _middleware.js 안 상수로 쓰인다.
# ※ share-image.js·board-sweep.js 는 이제 Supabase 대신 Firebase Cloud Functions
#   (shareImageOk·boardReferencedKeys, https://us-central1-anytime-rokafa.cloudfunctions.net/…)
#   를 직접 호출한다 — Supabase 관련 변수는 모두 제거됨(2026-09-01, Firebase 이관 완료).

# R2 버킷 바인딩 (대시보드에서 'anytime-exams' 비공개 버킷 생성 필요)
[[r2_buckets]]
binding = "EXAM_FILES"
bucket_name = "anytime-exams"

# ※ 강의 PDF 파싱(functions/api/parse-syllabus)은 Workers AI → Gemini 로 옮겼다.
#   Workers AI 무료 뉴런(10,000/일)으로는 수강편람 1회 분석(페이지당 1회, ~18회 호출)에
#   하루치를 다 써서 4006(한도초과)으로 죽었다. 이제 GEMINI_API_KEY 시크릿을 쓴다:
#     wrangler pages secret put GEMINI_API_KEY
#   (유료 등급 키로 쓸 것 — 무료 등급은 제출 내용이 Google 학습·사람 검토에 사용된다.)

# ※ 프론트 빌드용 VITE_ 변수(VITE_FIREBASE_*)는 .env.production 에 커밋되어 있다
#   (Firebase 클라이언트 config 는 공개값 — apiKey 자체는 비밀 아님).
#   wrangler CLI 로 로컬 빌드 후 배포하면 로컬 .env 가 사용됨.
