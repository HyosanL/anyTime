name: Supabase Keep-Alive

# Supabase 무료 플랜은 약 7일간 요청이 없으면 프로젝트를 일시정지한다.
# 매일 가벼운 REST 요청을 보내 활동을 유지한다.
# (anon key 는 RLS 로 보호되어 공개돼도 안전 — PROJECT.md 보안 메모)
# ※ GitHub 는 60일간 저장소 활동이 없으면 예약 워크플로를 비활성화한다.

on:
  schedule:
    - cron: '17 2 * * *'   # 매일 02:17 UTC
  workflow_dispatch: {}      # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keeps project warm)
        env:
          SUPABASE_URL: https://hziofjijdyybsjvhihxv.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6aW9mamlqZHl5YnNqdmhpaHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNzE5NDIsImV4cCI6MjA5NzY0Nzk0Mn0.yZlm2V_hRHJfce8F5Zr5z7zPHsePUcGqRF0Vw0Wsfws
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/period?select=no&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          test "$code" = "200"
