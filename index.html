<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 링크 미리보기(OG): 서비스 일반 정보만 — 글 제목·내용은 절대 넣지 않는다(익명 커뮤니티 보호).
         SPA 폴백으로 모든 경로(/s/* 포함)가 이 정적 문서를 반환하므로 크롤러는 이 값만 본다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="애타 - AnyTime" />
    <meta property="og:title" content="애타 - AnyTime" />
    <meta property="og:description" content="공군사관학교 생도 커뮤니티" />
    <meta property="og:image" content="https://anytime.rokafa.app/icons/og.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <script>
      /* 첫 페인트 전 테마 적용(깜빡임 방지). 기본은 시스템 설정. */
      (function () {
        try {
          var p = localStorage.getItem('theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0b0f16' : '#ffffff');
        } catch (e) {}
      })();
      /* 카카오톡 인앱 브라우저 탈출 — 인앱에서는 PWA 설치·푸시가 안 되므로 밖으로 보낸다.
         Android 는 Chrome 을 지정해 연다. ⚠️ 패키지 미지정 intent 는 설치된 애타
         앱(WebAPK)이 아니라 기본 브라우저(삼성 인터넷 등)로 간다 — Android 12+ 링크
         캡처 제한으로 WebAPK 가 링크를 직접 못 잡는 것을 실측으로 확인(2026-07-05).
         iOS 는 사파리(kakaotalk://web/openExternal)로 전환한다.
         외부로 넘긴 뒤 인앱 창은 닫는다(스킴 실패해도 무해). */
      (function () {
        try {
          var ua = navigator.userAgent;
          if (!/KAKAOTALK/i.test(ua)) return;
          var url = location.href;
          if (/android/i.test(ua)) {
            location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
          } else {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
          }
          setTimeout(function () { location.href = 'kakaotalk://inappbrowser/close'; }, 500);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="애타" />
    <title>애타 - AnyTime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
